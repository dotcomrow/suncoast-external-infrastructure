name: Infra Deploy

on:
  push:
    branches:
      - prod
    paths:
      - terraform/**
  workflow_dispatch:
    inputs:
      apply:
        description: Create and apply an HCP Terraform run
        required: true
        type: boolean
        default: false
      confirmation:
        description: Type APPLY_EXTERNAL_INFRASTRUCTURE when apply is enabled
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: external-infrastructure-terraform
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_WORKSPACE: ${{ github.event.repository.name }}
      TFE_AGENT_POOL_ID: ${{ vars.TFE_AGENT_POOL_ID }}
    steps:
      - name: Check initial workflow and run mode
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
          APPLY_CONFIRMATION: ${{ inputs.confirmation }}
          MIGRATION_COMPLETE: ${{ vars.STATE_MIGRATION_COMPLETE }}
        shell: bash
        run: |
          set -euo pipefail
          initial_state="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/initial-deploy.yml" \
            --jq '.state')"
          [[ "${initial_state}" == "disabled_manually" ]] || {
            echo "Initial deployment has not completed" >&2
            exit 1
          }

          if [[ "${APPLY_REQUESTED}" == "true" ]]; then
            [[ "${APPLY_CONFIRMATION}" == "APPLY_EXTERNAL_INFRASTRUCTURE" ]] || {
              echo "Applicable run rejected: confirmation phrase did not match" >&2
              exit 1
            }
            [[ "${MIGRATION_COMPLETE}" == "true" ]] || {
              echo "Applicable run rejected: STATE_MIGRATION_COMPLETE is not true" >&2
              exit 1
            }
          fi

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Enforce self-hosted Terraform agent pool
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TFE_AGENT_POOL_ID:-}" == apool-* ]] || {
            echo "TFE_AGENT_POOL_ID is missing or invalid" >&2
            exit 1
          }

          payload="$(jq -n --arg agent_pool_id "${TFE_AGENT_POOL_ID}" '{data:{type:"workspaces",attributes:{"execution-mode":"agent","agent-pool-id":$agent_pool_id,"setting-overwrites":{"execution-mode":true,"agent-pool":true}}}}')"
          workspace_json="$(curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${TF_API_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            --data "${payload}" \
            "https://app.terraform.io/api/v2/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${TF_WORKSPACE}")"
          [[ "$(jq -r '.data.attributes["execution-mode"] // empty' <<<"${workspace_json}")" == "agent" ]]
          [[ "$(jq -r '.data.relationships["agent-pool"].data.id // empty' <<<"${workspace_json}")" == "${TFE_AGENT_POOL_ID}" ]]

      - name: Get next version
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        uses: reecetech/version-increment@a29aa752dc3b8118a2dc2ed93faf0e95a73a9c7e
        id: version
        with:
          scheme: calver
          increment: patch

      - name: Upload Terraform configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: terraform

      - name: Create Terraform run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: ${{ !(github.event_name == 'workflow_dispatch' && inputs.apply) }}
          message: GitHub ${{ github.event_name }} run ${{ github.run_id }}

      - name: Apply Terraform run
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        uses: hashicorp/tfc-workflows-github/actions/apply-run@8e08d1ba957673f5fbf971a22b3219639dc45661
        with:
          run: ${{ steps.run.outputs.run_id }}
          comment: Approved external infrastructure apply from GitHub run ${{ github.run_id }}

      - name: Create release
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.VERSION,
              target_commitish: 'prod',
              name: process.env.VERSION,
              generate_release_notes: true
            });

      - name: Report run
        shell: bash
        run: |
          echo "HCP Terraform run: ${{ steps.run.outputs.run_link }}"
