name: Bootstrap HCP Terraform workspace

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: HCP Terraform project name
        required: true
        default: Suncoast External Infrastructure
        type: string
      confirmation:
        description: Type CREATE_INERT_WORKSPACE
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    if: inputs.confirmation == 'CREATE_INERT_WORKSPACE'
    runs-on: ubuntu-latest
    env:
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_WORKSPACE: ${{ github.event.repository.name }}
      TF_PROJECT_NAME: ${{ inputs.project_name }}
    steps:
      - name: Validate token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TF_API_TOKEN:-}" || {
            echo "TFE_TOKEN is unavailable to this repository" >&2
            exit 1
          }

      - name: Create or locate project and workspace
        shell: bash
        run: |
          set -euo pipefail

          api="https://app.terraform.io/api/v2"
          auth_header="Authorization: Bearer ${TF_API_TOKEN}"
          content_header="Content-Type: application/vnd.api+json"

          projects_json="$(curl --fail --silent --show-error \
            --header "${auth_header}" \
            --header "${content_header}" \
            "${api}/organizations/${TF_CLOUD_ORGANIZATION}/projects")"
          project_id="$(jq -r --arg name "${TF_PROJECT_NAME}" \
            '.data[] | select(.attributes.name == $name) | .id' \
            <<<"${projects_json}" | head -n1)"

          if [[ -z "${project_id}" ]]; then
            project_payload="$(jq -n --arg name "${TF_PROJECT_NAME}" \
              '{data:{type:"projects",attributes:{name:$name}}}')"
            project_json="$(curl --fail --silent --show-error \
              --request POST \
              --header "${auth_header}" \
              --header "${content_header}" \
              --data "${project_payload}" \
              "${api}/organizations/${TF_CLOUD_ORGANIZATION}/projects")"
            project_id="$(jq -r '.data.id' <<<"${project_json}")"
            echo "Created HCP Terraform project ${TF_PROJECT_NAME}"
          else
            echo "Using existing HCP Terraform project ${TF_PROJECT_NAME}"
          fi

          workspace_status="$(curl --silent --show-error \
            --output /tmp/workspace.json \
            --write-out '%{http_code}' \
            --header "${auth_header}" \
            --header "${content_header}" \
            "${api}/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${TF_WORKSPACE}")"

          if [[ "${workspace_status}" == "404" ]]; then
            workspace_payload="$(jq -n \
              --arg name "${TF_WORKSPACE}" \
              --arg project_id "${project_id}" \
              '{data:{type:"workspaces",attributes:{name:$name,"auto-apply":false},relationships:{project:{data:{type:"projects",id:$project_id}}}}}')"
            curl --fail --silent --show-error \
              --request POST \
              --header "${auth_header}" \
              --header "${content_header}" \
              --data "${workspace_payload}" \
              "${api}/organizations/${TF_CLOUD_ORGANIZATION}/workspaces" \
              >/tmp/workspace.json
            echo "Created inert workspace ${TF_WORKSPACE} with auto-apply disabled"
          elif [[ "${workspace_status}" == "200" ]]; then
            workspace_id="$(jq -r '.data.id' /tmp/workspace.json)"
            workspace_payload='{"data":{"type":"workspaces","attributes":{"auto-apply":false}}}'
            curl --fail --silent --show-error \
              --request PATCH \
              --header "${auth_header}" \
              --header "${content_header}" \
              --data "${workspace_payload}" \
              "${api}/workspaces/${workspace_id}" \
              >/tmp/workspace.json
            echo "Workspace ${TF_WORKSPACE} already exists; auto-apply is disabled"
          else
            cat /tmp/workspace.json >&2
            exit 1
          fi

          jq -e '.data.attributes["auto-apply"] == false' /tmp/workspace.json >/dev/null
          echo "No Terraform configuration was uploaded and no run was created"
