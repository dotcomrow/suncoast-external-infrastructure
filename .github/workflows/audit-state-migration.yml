name: Audit HCP Terraform state migration

on:
  workflow_dispatch:
    inputs:
      source_workspace:
        description: Existing HCP Terraform workspace
        required: true
        default: k8s-cms
        type: string
      target_workspace:
        description: New HCP Terraform workspace
        required: true
        default: suncoast-external-infrastructure
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      SOURCE_WORKSPACE: ${{ inputs.source_workspace }}
      TARGET_WORKSPACE: ${{ inputs.target_workspace }}
    steps:
      - name: Inspect workspace metadata and resource addresses
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TF_API_TOKEN:-}" || {
            echo "TFE_TOKEN is unavailable to this repository" >&2
            exit 1
          }

          api="https://app.terraform.io/api/v2"
          auth_header="Authorization: Bearer ${TF_API_TOKEN}"
          content_header="Content-Type: application/vnd.api+json"

          get_workspace() {
            local name="$1"
            curl --fail --silent --show-error \
              --header "${auth_header}" \
              --header "${content_header}" \
              "${api}/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${name}"
          }

          source_json="$(get_workspace "${SOURCE_WORKSPACE}")"
          target_json="$(get_workspace "${TARGET_WORKSPACE}")"
          source_id="$(jq -r '.data.id' <<<"${source_json}")"
          target_id="$(jq -r '.data.id' <<<"${target_json}")"

          echo "Source workspace: ${SOURCE_WORKSPACE}"
          jq -r '.data.attributes | "  terraform-version=\(."terraform-version") auto-apply=\(."auto-apply") locked=\(.locked) resource-count=\(."resource-count")"' <<<"${source_json}"
          echo "Target workspace: ${TARGET_WORKSPACE}"
          jq -r '.data.attributes | "  terraform-version=\(."terraform-version") auto-apply=\(."auto-apply") locked=\(.locked) resource-count=\(."resource-count")"' <<<"${target_json}"

          for workspace_role in source target; do
            if [[ "${workspace_role}" == "source" ]]; then
              workspace_id="${source_id}"
            else
              workspace_id="${target_id}"
            fi

            echo "${workspace_role^} workspace variables (values suppressed):"
            curl --fail --silent --show-error \
              --header "${auth_header}" \
              --header "${content_header}" \
              "${api}/workspaces/${workspace_id}/vars" \
              | jq -r '.data[] | "  \(.attributes.key) category=\(.attributes.category) sensitive=\(.attributes.sensitive) hcl=\(.attributes.hcl)"' \
              | sort

            echo "${workspace_role^} variable sets:"
            workspace_varsets_json="$(curl --fail --silent --show-error \
              --header "${auth_header}" \
              --header "${content_header}" \
              "${api}/workspaces/${workspace_id}/varsets")"
            jq -r '.data[]? | "  \(.attributes.name)"' <<<"${workspace_varsets_json}" | sort

            while IFS=$'\t' read -r varset_id varset_name; do
              [[ -n "${varset_id}" ]] || continue
              echo "  ${varset_name} variables (values suppressed):"
              curl --fail --silent --show-error \
                --header "${auth_header}" \
                --header "${content_header}" \
                "${api}/varsets/${varset_id}/relationships/vars?page%5Bsize%5D=100" \
                | jq -r '.data[]? | "    \(.attributes.key) category=\(.attributes.category) sensitive=\(.attributes.sensitive) hcl=\(.attributes.hcl)"' \
                | sort
            done < <(jq -r '.data[]? | [.id, .attributes.name] | @tsv' <<<"${workspace_varsets_json}")

            echo "${workspace_role^} managed OCI/TLS resource addresses:"
            curl --fail --silent --show-error \
              --header "${auth_header}" \
              --header "${content_header}" \
              "${api}/workspaces/${workspace_id}/resources?page%5Bsize%5D=100" \
              | jq -r '.data[] | select(.attributes.provider | test("oracle/oci|hashicorp/tls")) | "  \(.attributes.address) provider=\(.attributes.provider)"' \
              | sort
          done

          source_state_status="$(curl --silent --show-error \
            --output /tmp/source-state-version.json \
            --write-out '%{http_code}' \
            --header "${auth_header}" \
            --header "${content_header}" \
            "${api}/workspaces/${source_id}/current-state-version")"
          if [[ "${source_state_status}" == "200" ]]; then
            source_state_id="$(jq -r '.data.id' /tmp/source-state-version.json)"
            jq -r '.data | "Source current state: \(.id) serial=\(.attributes.serial) terraform-version=\(.attributes["terraform-version"])"' /tmp/source-state-version.json
            echo "Relevant source outputs (values suppressed):"
            curl --fail --silent --show-error \
              --header "${auth_header}" \
              --header "${content_header}" \
              "${api}/state-versions/${source_state_id}/outputs?page%5Bsize%5D=100" \
              | jq -r '.data[] | select(.attributes.name | test("^(db_|directus_uploads_nfs|directus_db_user|vault_secret_directus_db)")) | "  \(.attributes.name) sensitive=\(.attributes.sensitive)"' \
              | sort
          else
            echo "Source current state: unavailable (HTTP ${source_state_status})"
          fi

          target_state_status="$(curl --silent --show-error \
            --output /tmp/target-state-version.json \
            --write-out '%{http_code}' \
            --header "${auth_header}" \
            --header "${content_header}" \
            "${api}/workspaces/${target_id}/current-state-version")"
          if [[ "${target_state_status}" == "200" ]]; then
            jq -r '.data | "Target current state: \(.id) serial=\(.attributes.serial) terraform-version=\(.attributes["terraform-version"])"' /tmp/target-state-version.json
          elif [[ "${target_state_status}" == "404" ]]; then
            echo "Target current state: none"
          else
            echo "Target current state: unavailable (HTTP ${target_state_status})"
          fi

          rm -f /tmp/source-state-version.json /tmp/target-state-version.json
