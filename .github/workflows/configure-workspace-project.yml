name: Configure Terraform workspace project

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MOVE_WORKSPACE_TO_CONFIGURED_PROJECT
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: external-infrastructure-workspace-project
  cancel-in-progress: false

jobs:
  configure:
    if: inputs.confirmation == 'MOVE_WORKSPACE_TO_CONFIGURED_PROJECT'
    name: Move workspace to configured project
    runs-on: ubuntu-latest
    env:
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_WORKSPACE: ${{ github.event.repository.name }}
      TFE_PROJECT: ${{ vars.TFE_PROJECT }}
    steps:
      - name: Resolve configured project and move workspace
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${TF_API_TOKEN:-}" ]] || {
            echo "TFE_TOKEN is unavailable to this repository" >&2
            exit 1
          }
          [[ -n "${TFE_PROJECT:-}" ]] || {
            echo "TFE_PROJECT is unavailable to this repository" >&2
            exit 1
          }

          api="https://app.terraform.io/api/v2"
          auth_header="Authorization: Bearer ${TF_API_TOKEN}"
          content_header="Content-Type: application/vnd.api+json"
          projects_json="$(curl --fail --silent --show-error \
            --header "${auth_header}" \
            --header "${content_header}" \
            "${api}/organizations/${TF_CLOUD_ORGANIZATION}/projects?page%5Bsize%5D=100")"
          project_count="$(jq --arg name "${TFE_PROJECT}" '[.data[]? | select(.attributes.name == $name)] | length' <<<"${projects_json}")"
          [[ "${project_count}" == "1" ]] || {
            echo "Expected exactly one HCP Terraform project named ${TFE_PROJECT}; found ${project_count}" >&2
            exit 1
          }
          project_id="$(jq -r --arg name "${TFE_PROJECT}" '.data[] | select(.attributes.name == $name) | .id' <<<"${projects_json}")"

          workspace_json="$(curl --fail --silent --show-error \
            --header "${auth_header}" \
            --header "${content_header}" \
            "${api}/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${TF_WORKSPACE}")"
          workspace_id="$(jq -r '.data.id' <<<"${workspace_json}")"
          current_project_id="$(jq -r '.data.relationships.project.data.id' <<<"${workspace_json}")"

          if [[ "${current_project_id}" != "${project_id}" ]]; then
            payload="$(jq -n \
              --arg workspace_id "${workspace_id}" \
              --arg project_id "${project_id}" \
              '{data:{id:$workspace_id,type:"workspaces",relationships:{project:{data:{type:"projects",id:$project_id}}}}}')"
            workspace_json="$(curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "${auth_header}" \
              --header "${content_header}" \
              --data "${payload}" \
              "${api}/workspaces/${workspace_id}")"
          fi

          [[ "$(jq -r '.data.relationships.project.data.id' <<<"${workspace_json}")" == "${project_id}" ]]
          echo "Workspace ${TF_WORKSPACE} is assigned to HCP Terraform project ${TFE_PROJECT}"
