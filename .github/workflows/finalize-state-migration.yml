name: Finalize one-time OCI state migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type FINALIZE_OCI_STATE_MIGRATION
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: external-infrastructure-state-migration
  cancel-in-progress: false

jobs:
  finalize:
    if: inputs.confirmation == 'FINALIZE_OCI_STATE_MIGRATION'
    runs-on: ubuntu-latest
    env:
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_WORKSPACE: ${{ github.event.repository.name }}
      SOURCE_WORKSPACE: k8s-cms
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Verify exclusive state ownership
        shell: bash
        run: |
          set -euo pipefail
          api="https://app.terraform.io/api/v2"
          auth_header="Authorization: Bearer ${TF_API_TOKEN}"
          content_header="Content-Type: application/vnd.api+json"

          source_json="$(curl --fail --silent --show-error --header "${auth_header}" --header "${content_header}" "${api}/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${SOURCE_WORKSPACE}")"
          target_json="$(curl --fail --silent --show-error --header "${auth_header}" --header "${content_header}" "${api}/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${TF_WORKSPACE}")"
          source_id="$(jq -r '.data.id' <<<"${source_json}")"
          target_id="$(jq -r '.data.id' <<<"${target_json}")"

          source_resources="$(curl --fail --silent --show-error --header "${auth_header}" --header "${content_header}" "${api}/workspaces/${source_id}/resources?page%5Bsize%5D=100")"
          source_oci_count="$(jq '[.data[]? | select(.attributes.provider | test("oracle/oci|hashicorp/tls"))] | length' <<<"${source_resources}")"
          [[ "${source_oci_count}" == "0" ]] || {
            echo "Source workspace still contains ${source_oci_count} OCI/TLS resource records" >&2
            exit 1
          }

          target_resources="$(curl --fail --silent --show-error --header "${auth_header}" --header "${content_header}" "${api}/workspaces/${target_id}/resources?page%5Bsize%5D=100")"
          expected_addresses=(
            'oci_core_instance.directus_db'
            'oci_core_internet_gateway.directus_db'
            'oci_core_public_ip.directus_db_reserved[0]'
            'oci_core_route_table.directus_db'
            'oci_core_security_list.directus_db'
            'oci_core_subnet.directus_db'
            'oci_core_vcn.directus_db'
          )
          for address in "${expected_addresses[@]}"; do
            jq -e --arg address "${address}" '.data[]? | select(.attributes.address == $address)' <<<"${target_resources}" >/dev/null || {
              echo "Target state is missing ${address}" >&2
              exit 1
            }
          done
          target_oci_count="$(jq '[.data[]? | select((.attributes.provider | test("oracle/oci")) and ((.attributes.address | startswith("data.")) | not))] | length' <<<"${target_resources}")"
          [[ "${target_oci_count}" == "7" ]] || {
            echo "Target workspace contains an unexpected number of managed OCI resource records: ${target_oci_count}" >&2
            exit 1
          }
          echo "State ownership is exclusive: source=0, target=7 managed OCI resources"

      - name: Upload normal target configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: terraform

      - name: Create final zero-change run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: true
          message: Final OCI state migration verification

      - name: Read final plan summary
        uses: hashicorp/tfc-workflows-github/actions/plan-output@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: plan
        with:
          plan: ${{ steps.run.outputs.plan_id }}

      - name: Require a clean final plan
        env:
          PLAN_ADD: ${{ steps.plan.outputs.add }}
          PLAN_CHANGE: ${{ steps.plan.outputs.change }}
          PLAN_DESTROY: ${{ steps.plan.outputs.destroy }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PLAN_ADD}" == "0" && "${PLAN_CHANGE}" == "0" && "${PLAN_DESTROY}" == "0" ]] || {
            echo "Final target plan is not clean: add=${PLAN_ADD}, change=${PLAN_CHANGE}, destroy=${PLAN_DESTROY}" >&2
            exit 1
          }
          echo "Final zero-change run: ${{ steps.run.outputs.run_link }}"
